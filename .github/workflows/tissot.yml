name: Build for tissot

on:
  push:
    branches:
      - tissot
  pull_request:
    branches:
      - tissot
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder's sourcecode and get files
        uses: actions/checkout@v4

      - name: Checkout kernel's sourcecode and clone submodules
        run: |
          git clone --depth=1 https://github.com/miracle7x/kernel_xiaomi_tissot_another_kernel/ -b main

      - name: Export date of build
        run: |
          echo "DATE=$(date +%d%m%Y)" >> $GITHUB_ENV

      - name: Clone AnyKernel3
        run: |
          cd kernel_xiaomi_tissot_another_kernel
          git clone --depth=1 -b tissot https://github.com/miracle7x/AnyKernel3.git anykernel
          rm -rf anykernel/.git

      - name: Install dépendencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
          python3-pip \
          git \
          zip \
          unzip \
          gcc \
          g++ \
          make \
          ninja-build \
          file \
          bc \
          bison \
          flex \
          libfl-dev \
          libssl-dev \
          libelf-dev \
          wget \
          build-essential \
          python3-dev \
          python3-setuptools \
          rsync \
          ccache \
          llvm-dev
          sudo apt install flex libncurses6 libncurses5 binutils-aarch64-linux-gnu device-tree-compiler \
          android-sdk-libsparse-utils python2
          sudo apt install -y gcc-arm-linux-gnueabi
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Install Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm

      - name: Add Clang to the PATH
        run: |
          echo "${{ runner.temp }}/llvm/bin" >> $GITHUB_PATH
      
      - name: Use repo's mkdtimg
        run: |
          chmod +x tools/mkdtimg
          sudo mv tools/mkdtimg /usr/local/bin/mkdtimg

      - name: Device's codename and kernel's version
        run: |
          cd kernel_xiaomi_tissot_another_kernel
          DEVICE_CODENAME=tissot
          KERNEL_VERSION=$(make kernelversion | grep -E '^[0-9]+\.[0-9]+\.[0-9]+')

          echo "Device Codename: $DEVICE_CODENAME"
          echo "Kernel Version: $KERNEL_VERSION"

          echo "DEVICE_CODENAME=$DEVICE_CODENAME" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

      - name: Enable ccache to speed the build up
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 7G

      - name: Setup KernelSU
        run: |
          cd kernel_xiaomi_tissot_another_kernel
          curl -LSs "https://raw.githubusercontent.com/JBHPocong/BakaSU/main/kernel/setup.sh" | bash 
          curl "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s master

      - name: Build the kramel
        run: |
          cd kernel_xiaomi_tissot_another_kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1)
          export CCACHE_EXEC=$(which ccache)
          export KBUILD_BUILD_HOST="runner-build"

          make O=out ARCH=arm64 tissot_defconfig

          # config yang dibutuhkan BakaSU di Non-GKI 4.9
          scripts/config --file out/.config \
            -e KSU \
            -e MODULES \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e OVERLAY_FS

          make O=out ARCH=arm64 olddefconfig
          # lanjut make -j seperti sebelumnya
            make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            
      - name : compiled kernel to AnyKernel3 then create the zip
        run: |
          cd kernel_xiaomi_tissot_another_kernel
          ZIP_NAME="Ast-${DEVICE_CODENAME}-${KERNEL_VERSION}-$(date +%d%m%Y).zip"

          cp out/arch/arm64/boot/Image.gz-dtb anykernel/

          cd anykernel && zip -r9 $ZIP_NAME ./*
          mv $ZIP_NAME ../../

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
      
      - name: Copy zip file to get 2 different zip files
        run: |

          ZIP_ALTERNATIVE="KernelSU-Caelum-${DEVICE_CODENAME}-latest.zip"
          cp ${ZIP_NAME} $ZIP_ALTERNATIVE

          echo "Copied ${ZIP_NAME} as $ZIP_ALTERNATIVE"
          echo "ZIP_ALTERNATIVE=$ZIP_ALTERNATIVE" >> $GITHUB_ENV

      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Caelum-${{ env.DEVICE_CODENAME }}-${{ env.KERNEL_VERSION }}-${{ env.DATE }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
